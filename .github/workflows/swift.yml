name: Swift

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build CLI and GUI
        run: swift build -c release --product macpi --product macpi-gui
      - name: Run tests
        run: swift test
